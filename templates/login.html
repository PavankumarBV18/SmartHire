{% extends "base.html" %}

{% block title %}Sign In - SmartHire{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative">
  <!-- Dynamic Mesh Background (Optional local enhancement) -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[80vw] h-[80vw] max-w-[600px] max-h-[600px] bg-indigo-500/10 rounded-full blur-[120px]"></div>
  </div>

  <div class="max-w-md w-full glass-card p-10 relative z-10 border border-slate-700/50">
    <!-- Glow accent -->
    <div class="absolute top-0 right-0 w-32 h-32 bg-indigo-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 pointer-events-none"></div>
    <div class="absolute bottom-0 left-0 w-32 h-32 bg-emerald-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 pointer-events-none"></div>
    
    <div class="mb-8 relative z-10">
      <div class="w-16 h-16 bg-slate-800/80 rounded-2xl flex items-center justify-center border border-slate-700/50 mx-auto mb-6 shadow-inner">
        <i class="fas fa-fingerprint text-3xl text-indigo-400"></i>
      </div>
      <h2 class="text-center text-3xl font-black text-white font-heading tracking-tight">
        Welcome Back
      </h2>
      <p class="mt-2 text-center text-sm font-bold text-slate-400 uppercase tracking-widest">
        Sign in to your account
      </p>
    </div>
    
    {% if error %}
    <div class="bg-red-500/10 border border-red-500/20 p-4 mb-6 rounded-xl flex items-start gap-3 fade-in relative z-10">
      <i class="fas fa-exclamation-circle text-red-400 mt-0.5"></i>
      <p class="text-sm text-red-400 font-medium tracking-wide">
        {{ error }}
      </p>
    </div>
    {% endif %}

    <form class="space-y-6 relative z-10" action="/login" method="POST">
      <div class="space-y-5">
        <div>
          <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1.5 ml-1">Email address</label>
          <div class="flex items-center bg-slate-800/60 border border-slate-700/50 rounded-xl px-4 focus-within:border-indigo-500/50 transition-all">
            <i class="fas fa-envelope text-slate-500 mr-3 text-xs"></i>
            <input name="email" type="email" autocomplete="email" required class="bg-transparent border-none focus:outline-none focus:ring-0 py-3.5 text-sm text-white w-full placeholder-slate-600" placeholder="john@example.com">
          </div>
        </div>
        <div>
          <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1.5 ml-1">Password</label>
          <div class="flex items-center bg-slate-800/60 border border-slate-700/50 rounded-xl px-4 focus-within:border-indigo-500/50 transition-all">
            <i class="fas fa-lock text-slate-500 mr-3 text-xs"></i>
            <input id="login_password" name="password" type="password" autocomplete="current-password" required class="bg-transparent border-none focus:outline-none focus:ring-0 py-3.5 text-sm text-white w-full placeholder-slate-600" placeholder="••••••••">
            <button type="button" onclick="togglePassword('login_password', 'login_icon')" class="text-slate-500 hover:text-indigo-400 focus:outline-none transition-colors ml-2">
                <i id="login_icon" class="fas fa-eye"></i>
            </button>
          </div>
        </div>
      </div>

      <div class="pt-2">
        <button type="submit" class="w-full btn-premium btn-primary py-4 uppercase text-xs tracking-widest font-black shadow-[0_4px_20px_rgba(79,70,229,0.3)] flex justify-center items-center gap-2 group">
          Sign In
          <i class="fas fa-arrow-right text-[10px] opacity-70 group-hover:translate-x-1 transition-transform"></i>
        </button>
      </div>
      
      <div class="text-[11px] font-bold text-center mt-6 border-t border-slate-800/60 pt-6 uppercase tracking-wider text-slate-500">
        <div class="mb-4">
          <span>New here?</span>
          <a href="/register" class="text-indigo-400 hover:text-indigo-300 transition-colors ml-1">Sign Up</a>
        </div>
        
        <div class="pt-4 border-t border-slate-800/40">
          <p class="text-slate-600 mb-2">Are you an Administrator?</p>
          <div class="flex justify-center gap-6">
            <a href="/admin-key-verify" class="text-emerald-500 hover:text-emerald-400 transition-colors flex items-center gap-2">
              <i class="fas fa-user-shield text-[10px]"></i>
              Admin Sign Up
            </a>
            <span class="text-slate-700">|</span>
            <a href="/admin-login" class="text-emerald-500 hover:text-emerald-400 transition-colors flex items-center gap-2">
              <i class="fas fa-lock-open text-[10px]"></i>
              Admin Login
            </a>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
<script>
function togglePassword(inputId, iconId) {
  const pwd = document.getElementById(inputId);
  const icon = document.getElementById(iconId);
  if (pwd.type === 'password') {
    pwd.type = 'text';
    icon.classList.remove('fa-eye');
    icon.classList.add('fa-eye-slash');
  } else {
    pwd.type = 'password';
    icon.classList.remove('fa-eye-slash');
    icon.classList.add('fa-eye');
  }
}
</script>
{% endblock %}
