{% extends "base.html" %}

{% block title %}System Failure - SmartHire{% endblock %}

{% block content %}
<div class="container mx-auto px-6 py-32 text-center fade-in">
  <div
    class="w-32 h-32 bg-red-500/10 border border-red-500/20 rounded-[2.5rem] flex items-center justify-center mx-auto mb-10 shadow-[0_0_50px_rgba(239,68,68,0.1)]">
    <i class="fas fa-microchip-slash text-red-500 text-4xl"></i>
  </div>
  <h1 class="text-6xl md:text-8xl font-black text-white mb-6 font-heading tracking-tighter">500</h1>
  <p class="text-xl md:text-2xl text-slate-400 mb-12 font-medium">Critical system failure. Our neural engineers have
    been notified.</p>

  <div class="flex flex-col sm:flex-row justify-center gap-6">
    <a href="/"
      class="btn-premium btn-primary py-4 px-10 text-xs font-black uppercase tracking-[0.2em] bg-red-600 hover:bg-red-500 shadow-red-500/20">
      <i class="fas fa-rotate-left mr-2 opacity-60"></i> Reboot Session
    </a>
    <a href="mailto:support@smarthire.ai"
      class="btn-premium btn-outline py-4 px-10 text-xs font-black uppercase tracking-[0.2em] border-red-500/30 text-red-400">
      <i class="fas fa-headset mr-2 opacity-50"></i> Technical Support
    </a>
  </div>
</div>
{% endblock %}
