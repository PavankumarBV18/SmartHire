{% extends "base.html" %}

{% block title %}Premium Locked - SmartHire{% endblock %}

{% block content %}
<div class="container mx-auto px-6 max-w-4xl pt-24 pb-12 text-center">
    <div class="glass-card p-12">
        <div class="mb-6 flex justify-center">
            <div class="w-24 h-24 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-4xl text-amber-500 shadow-[0_0_30px_rgba(245,158,11,0.2)]">
                <i class="fas fa-lock"></i>
            </div>
        </div>
        <h1 class="text-4xl font-black text-white mb-4">Premium Feature</h1>
        <p class="text-xl text-slate-400 mb-8 max-w-2xl mx-auto">
            Upgrade your plan to unlock this feature and take your career growth to the next level.
        </p>
        <div class="flex justify-center gap-4">
            <a href="/subscription" class="btn-premium px-8 py-3 text-lg">
                <i class="fas fa-crown mr-2"></i> Upgrade Now
            </a>
            <a href="javascript:history.back()" class="bg-slate-800 hover:bg-slate-700 text-white px-8 py-3 rounded-xl transition-colors border border-slate-700 font-medium text-lg">
                Go Back
            </a>
        </div>
    </div>
</div>
{% endblock %}
